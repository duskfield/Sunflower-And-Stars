<script>
'use strict';
/* ================= 基础工具 ================= */
const DAY = 300;                 // 一天 = 5 分钟
const GROW = 70;                 // 白天满速长成所需秒数
const MAXF = 16;
const SAVE_KEY = 'sunflower-stars-v1';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeOut=t=>1-Math.pow(1-t,3);
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul=(c,l)=>[c[0]*l[0],c[1]*l[1],c[2]*l[2]];
const css=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function bump(h,c,w){let d=Math.abs(h-c);d=Math.min(d,24-d);return Math.exp(-d*d/(2*w*w))}

/* ================= 状态 & 存档 ================= */
const Q=new URLSearchParams(location.search);
const PREVIEW=Q.has('t');
let state={seeds:0,stars:0,gameTime:0,flowers:[],newAt:-9999,totalHarvest:0,love:{},loveHint:false};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&!PREVIEW)Object.assign(state,s)}catch(e){}
let dayOffset=0.235;
if(PREVIEW){dayOffset=parseFloat(Q.get('t'))||0;state.stars=+(Q.get('stars')||14);state.seeds=+(Q.get('seeds')||130);
  const r=rng(7);for(let i=0;i<10;i++)state.flowers.push({nx:.08+i*.093+r()*.03,ny:r(),g:i/9,y:50,ph:r()*6});}
let resetting=false;
function save(){if(PREVIEW||resetting)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){}}
setInterval(save,4000);addEventListener('beforeunload',save);
const dayT=()=>((state.gameTime/DAY)+dayOffset)%1;

/* ================= 画布 ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,U,L={};   // L: 预生成的地形
const PAL={
  ink:hex('#4f463f'),far:hex('#a3abbd'),mid:hex('#93aa9c'),near:hex('#a9bd8f'),ground:hex('#b6c592'),groundB:hex('#9fb27e'),
  pine:hex('#7d9a88'),tree:hex('#93ad82'),trunk:hex('#8c7564'),wall:hex('#ebe0cb'),roof:hex('#b98f7f'),cloud:hex('#fbf8f1'),
  petal:hex('#e8c66f'),petalB:hex('#d6ac5c'),disc:hex('#8a6648'),discD:hex('#5f4535'),stem:hex('#8eaa76'),leaf:hex('#9cb784'),
  soil:hex('#a68d74'),grassF:hex('#7f9a6c'),bud:hex('#a3bb7e'),blush:hex('#e7a99a')
};
function ridge(seed,base,amp,freqs,sharp){
  const r=rng(seed),comps=freqs.map(f=>({f,p:r()*6.283,a:r()*.5+.5})),pts=[];
  for(let x=-90;x<=W+90;x+=6){let v=0,n=0;comps.forEach((c,i)=>{v+=Math.sin(x/W*c.f*6.283+c.p)*c.a/(i+1);n+=c.a/(i+1)});v/=n;
    let f=sharp?Math.pow(1-Math.abs(v),1.6):(v+1)/2;pts.push([x,base-amp*f])}
  return pts;
}
const yAt=(pts,x)=>pts[clamp(Math.round((x+90)/6),0,pts.length-1)][1];
function build(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  U=Math.min(H/850,W/480);U=clamp(U,.55,1.5);
  L.far=ridge(11,H*.47,H*.13,[1.3,2.7,5.1],true);
  L.mid=ridge(23,H*.55,H*.07,[1.1,2.3,4.4],false);
  L.near=ridge(37,H*.63,H*.05,[.8,1.9,3.7],false);
  L.gnd=ridge(41,H*.705,H*.018,[1.2,3.1],false);
  const r=rng(99);
  L.pines=[];for(let i=0;i<Math.round(W/38);i++){const x=r()*(W+120)-60;L.pines.push({x,y:yAt(L.mid,x)+r()*H*.03+3,s:(.7+r()*.6)*U})}
  L.pines.sort((a,b)=>a.y-b.y);
  L.trees=[];for(let i=0;i<Math.round(W/110)+3;i++){const x=r()*(W+120)-60;if(Math.abs(x-W*.78)<70*U)continue;L.trees.push({x,y:yAt(L.near,x)+r()*H*.02+4,s:(.8+r()*.5)*U,k:r()})}
  L.trees.sort((a,b)=>a.y-b.y);
  L.house={x:W*.78,y:yAt(L.near,W*.78)+8*U};
  L.tufts=[];for(let i=0;i<Math.round(W*H/5200);i++){const ny=r();L.tufts.push({x:r()*(W+120)-60,y:lerp(H*.715,H,Math.pow(ny,.8)),t:r()<.12?(r()<.5?1:2):0,k:r()})}
  L.tufts.sort((a,b)=>a.y-b.y);
  L.blades=[];for(let x=-60;x<W+60;x+=7*U){L.blades.push({x:x+r()*5,h:(18+r()*46)*U,b:(r()-.5)*14*U,p:r()*6})}
  L.bg=[];for(let i=0;i<220;i++)L.bg.push({x:r(),y:Math.pow(r(),1.3)*.56,s:.4+r()*1.2,p:r()*6,sp:.5+r()*2});
  L.clouds=[];for(let i=0;i<7;i++){const n=4+(r()*3|0),parts=[];for(let k=0;k<n;k++)parts.push([(k-(n-1)/2)*26+r()*10,-r()*18*(1-Math.abs(k-(n-1)/2)/n*1.6),16+r()*14]);
    L.clouds.push({x:r()*(W+400),y:H*(.07+r()*.28),s:(.6+r()*.7)*U,v:(4+r()*6)*U,parts,d:r()})}
}
addEventListener('resize',build);build();

/* 发光贴图 */
function glowSprite(c){const g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d'),gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,`rgba(${c},1)`);gr.addColorStop(.25,`rgba(${c},.45)`);gr.addColorStop(1,`rgba(${c},0)`);x.fillStyle=gr;x.fillRect(0,0,64,64);return g}
const GLOW_STAR=glowSprite('255,244,214'),GLOW_FLY=glowSprite('232,240,170'),GLOW_WARM=glowSprite('255,214,140');

/* ================= 天色关键帧 ================= */
const SKY=[
 {t:0.00,top:'#151b30',mid:'#222b47',bot:'#323c5c',l:[.36,.40,.56]},
 {t:0.18,top:'#1a2038',mid:'#2c3352',bot:'#464a6c',l:[.40,.42,.58]},
 {t:0.235,top:'#4a5478',mid:'#8a86a2',bot:'#e3b39c',l:[.78,.68,.70]},
 {t:0.28,top:'#86a3c0',mid:'#c3c9cf',bot:'#f2dcc0',l:[.97,.90,.84]},
 {t:0.36,top:'#92b6cf',mid:'#c3d8df',bot:'#ece9d8',l:[1,.97,.92]},
 {t:0.50,top:'#86b0cc',mid:'#b9d4dd',bot:'#e3ece6',l:[1,1,.98]},
 {t:0.64,top:'#94b2c8',mid:'#c8d2d2',bot:'#efe2c8',l:[1,.95,.87]},
 {t:0.72,top:'#8584a8',mid:'#c79fa4',bot:'#f0b892',l:[.98,.76,.66]},
 {t:0.77,top:'#4d4b74',mid:'#8a6f8e',bot:'#c98d86',l:[.70,.58,.66]},
 {t:0.83,top:'#232a48',mid:'#353d60',bot:'#535877',l:[.44,.46,.62]},
 {t:1.00,top:'#151b30',mid:'#222b47',bot:'#323c5c',l:[.36,.40,.56]}
].map(k=>({t:k.t,top:hex(k.top),mid:hex(k.mid),bot:hex(k.bot),l:k.l}));
function skyAt(t){let i=0;while(i<SKY.length-2&&SKY[i+1].t<=t)i++;const a=SKY[i],b=SKY[i+1],f=ss(0,1,(t-a.t)/(b.t-a.t));
  return{top:mix(a.top,b.top,f),mid:mix(a.mid,b.mid,f),bot:mix(a.bot,b.bot,f),l:mix(a.l,b.l,f)}}
const PHASES=[[0,3,'午夜'],[3,5,'凌晨'],[5,7,'日出'],[7,10,'清晨'],[10,11,'上午'],[11,13,'正午'],[13,16.5,'午后'],[16.5,17.5,'傍晚'],[17.5,19,'日落'],[19,23,'夜晚'],[23,24,'午夜']];
const phaseName=h=>PHASES.find(p=>h>=p[0]&&h<p[1])[2];

/* ================= 星座 ================= */

function unlockedAnimals(){const out=[];let n=state.stars;for(const c of CONS){if(n<c.pts.length)break;out.push(c.animal);n-=c.pts.length}return out}
function getPet(k){if(!pets[k])pets[k]={isPet:true,k,nx:.12+Math.random()*.76,ny:Math.random(),dir:Math.random()<.5?-1:1,tx:null,ty:0,wait:1+Math.random()*3,walk:0,pet:0,ph:Math.random()*6};return pets[k]}
function updatePets(dt){
  for(const k of unlockedAnimals()){const p=getPet(k);
    if(p.pet>0){p.pet-=dt;continue}
    if(p.tx==null){p.wait-=dt;if(p.wait<=0){p.tx=.08+Math.random()*.84;p.ty=Math.random()}continue}
    const dx=(p.tx-p.nx)*W,dy=plantY(p.ty)-plantY(p.ny),d=Math.hypot(dx,dy);
    if(d<3){p.tx=null;p.wait=2+Math.random()*5;continue}
    const step=Math.min(d,ANIMALS[k].speed*U*dt*1.4);p.nx+=dx/d*step/W;p.ny=clamp(p.ny+dy/d*step/(H*.195),0,1);if(Math.abs(dx)>1)p.dir=Math.sign(dx);p.walk+=dt}
}

/* ================= 音频 ================= */
const A={ctx:null,muted:false,music:true};
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(A.ctx)return;const AC=A.ctx=new(window.AudioContext||window.webkitAudioContext)();
  A.master=AC.createGain();A.master.gain.value=.9;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;A.master.connect(comp);comp.connect(AC.destination);
  A.rev=AC.createConvolver();A.rev.buffer=impulse(3.4,2.6);const ro=AC.createGain();ro.gain.value=.6;A.rev.connect(ro);ro.connect(A.master);
  A.revIn=AC.createGain();A.revIn.connect(A.rev);
  A.mus=bus(.5,.55);A.amb=bus(.9,.18);A.sfx=bus(.85,.5);
  A.noise=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);const d=A.noise.getChannelData(0);let b=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;b=.97*b+.03*w;d[i]=w*.5+b*3}
  // 风
  const wn=src(true),wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=500;wf.Q.value=.6;A.windF=wf;A.windG=AC.createGain();A.windG.gain.value=0;
  wn.connect(wf);wf.connect(A.windG);A.windG.connect(A.amb);wn.start();
  // 正午远处虫鸣
  const nn=src(true),nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=4600;nf.Q.value=9;const am=AC.createGain();am.gain.value=.5;
  const lfo=AC.createOscillator();lfo.frequency.value=16;const lg=AC.createGain();lg.gain.value=.5;lfo.connect(lg);lg.connect(am.gain);lfo.start();
  A.noonG=AC.createGain();A.noonG.gain.value=0;nn.connect(nf);nf.connect(am);am.connect(A.noonG);A.noonG.connect(A.amb);nn.start();
  // 夜里低低的溪流声
  const sn=src(true),sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=700;A.streamG=AC.createGain();A.streamG.gain.value=0;sn.connect(sf);sf.connect(A.streamG);A.streamG.connect(A.amb);sn.start();
  A.nextBeat=AC.currentTime+.3;A.beat=0;A.lastNote=7;
  setInterval(musicTick,100);setInterval(ambTick,100);
}
function bus(g,send){const b=A.ctx.createGain();b.gain.value=g;b.connect(A.master);const s=A.ctx.createGain();s.gain.value=send;b.connect(s);s.connect(A.revIn);return b}
function impulse(sec,dec){const AC=A.ctx,n=AC.sampleRate*sec,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}return b}
function src(loop){const s=A.ctx.createBufferSource();s.buffer=A.noise;s.loop=loop;return s}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)}
function panner(dest,p){if(!A.ctx.createStereoPanner)return dest;const pn=A.ctx.createStereoPanner();pn.pan.value=p;pn.connect(dest);return pn}
function pluck(m,t,vol,dest,dec=1.6,type='triangle'){const AC=A.ctx,o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type;o.frequency.value=mf(m);o2.type='sine';o2.frequency.value=mf(m)*2;const g2=AC.createGain();g2.gain.value=.25;
  f.type='lowpass';f.frequency.value=2800;o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(dest);env(g,t,.006,vol,dec);o.start(t);o2.start(t);o.stop(t+dec+.1);o2.stop(t+dec+.1)}
function bell(m,t,vol,dest,dec=2.4){const AC=A.ctx,g=AC.createGain();g.connect(dest);env(g,t,.004,vol,dec);
  [[1,1],[2.76,.28],[5.4,.09]].forEach(([r,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.frequency.value=mf(m)*r;og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+dec+.1)})}
function rustle(t,vol,freq=2600){const AC=A.ctx,s=src(false),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.value=freq;f.Q.value=.9;s.connect(f);f.connect(g);g.connect(A.sfx);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.05);g.gain.linearRampToValueAtTime(0,t+.3);s.start(t,Math.random()*2);s.stop(t+.35)}
// ---- 背景音乐（生成式，轻柔五声）----
const PROG=[[53,57,60,64],[48,55,62,64],[45,52,55,60],[43,50,55,62]];
const PENTA=[60,62,64,67,69,72,74,76,79,81,84,86,88];
function musicTick(){
  const AC=A.ctx,h=dayT()*24,night=nightF(dayT()),bpm=lerp(72,58,night),spb=60/bpm;
  while(A.nextBeat<AC.currentTime+.4){
    const t=A.nextBeat,ch=PROG[Math.floor(A.beat/8)%4];
    if(A.beat%8===0){ch.forEach((m,i)=>pad(m-(night>.5?12:0)*(i===0?1:0),t,spb*8,lerp(1100,560,night)));
      const bo=AC.createOscillator(),bg=AC.createGain();bo.frequency.value=mf(ch[0]-12);bo.connect(bg);bg.connect(A.mus);env(bg,t,.08,.07,spb*7);bo.start(t);bo.stop(t+spb*8)}
    if(Math.random()<lerp(.3,.14,night)){A.lastNote=clamp(A.lastNote+[-2,-1,-1,1,1,2,0][Math.random()*7|0],night>.5?0:3,PENTA.length-1-(night>.5?4:0));
      pluck(PENTA[A.lastNote],t+Math.random()*.02,.055,A.mus,lerp(1.6,2.4,night))}
    A.beat++;A.nextBeat+=spb/2;
  }
}
function pad(m,t,dur,cut){const AC=A.ctx,f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=cut;f.connect(g);g.connect(A.mus);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.022,t+1.4);g.gain.setValueAtTime(.022,t+dur-.4);g.gain.linearRampToValueAtTime(0,t+dur+1.6);
  [-5,5].forEach(dt=>{const o=AC.createOscillator();o.type='triangle';o.frequency.value=mf(m);o.detune.value=dt;o.connect(f);o.start(t);o.stop(t+dur+1.7)})}
// ---- 环境音 ----
function ambWeights(h){const n=nightF(dayT());return{
  birds:bump(h,7.3,1.9)+.25*bump(h,15.5,1.5), noon:bump(h,12.8,2), eve:bump(h,18.2,1.3),
  crick:n*(1-.45*bump(h,1,2.2)), owl:bump(h,0.5,2.5), wind:.25+.5*bump(h,0.5,3)+.35*bump(h,18,1.5), stream:bump(h,1.5,3.5)}}
function ambTick(){
  if(!A.ctx||document.hidden)return;const AC=A.ctx,t=AC.currentTime,w=ambWeights(dayT()*24);
  A.windG.gain.setTargetAtTime(.05+.14*w.wind*(.6+.4*Math.sin(t*.3)),t,1.5);
  A.noonG.gain.setTargetAtTime(.03*w.noon,t,2);A.streamG.gain.setTargetAtTime(.035*w.stream,t,2);
  if(Math.random()<.02)A.windF.frequency.setTargetAtTime(300+Math.random()*700,t,2);
  if(Math.random()<w.birds*.09)birdPhrase(false);
  if(Math.random()<w.eve*.025)birdPhrase(true);
  if(Math.random()<w.eve*.03)chimes();
  if(Math.random()<w.crick*.32)cricket();
  if(Math.random()<w.owl*.006)owl();
}
function birdPhrase(slow){const AC=A.ctx,t0=AC.currentTime+.05,n=2+(Math.random()*5|0),base=slow?1400+Math.random()*700:2300+Math.random()*1600,out=panner(A.amb,Math.random()*1.6-.8);let t=t0;
  const kind=Math.random()*3|0;
  for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),d=slow?.18:.05+Math.random()*.07,f=base*(1+(kind===0?i*.05:kind===1?-i*.04:(i%2)*.15));
    o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(kind===1?.75:1.3),t+d);o.connect(g);g.connect(out);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(slow?.025:.03,t+.012);g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d+.02);
    t+=d+(slow?.25:.03+Math.random()*.08)}}
function cricket(){const AC=A.ctx,t=AC.currentTime+.02,f=3900+Math.random()*900,o=AC.createOscillator(),g=AC.createGain(),out=panner(A.amb,Math.random()*1.8-.9),v=.012+Math.random()*.012;
  o.frequency.value=f;o.connect(g);g.connect(out);g.gain.setValueAtTime(0,t);
  for(let k=0;k<3;k++){const s=t+k*.055;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.008);g.gain.linearRampToValueAtTime(0,s+.035)}o.start(t);o.stop(t+.25)}
function owl(){const AC=A.ctx,out=panner(A.amb,Math.random()-.5);[0,.75,1.02].forEach((dt,i)=>{const t=AC.currentTime+.1+dt,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;
  o.frequency.setValueAtTime(i?360:390,t);o.frequency.linearRampToValueAtTime(i?335:350,t+.35);o.connect(f);f.connect(g);g.connect(out);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.07);g.gain.linearRampToValueAtTime(0,t+(i?.22:.4));o.start(t);o.stop(t+.5)})}
function chimes(){const t=A.ctx.currentTime;for(let i=0;i<1+(Math.random()*3|0);i++)bell(PENTA[7+(Math.random()*6|0)]+12,t+i*(.2+Math.random()*.3),.02,A.amb,3)}
// ---- 互动音效 ----
const SFX={
  plant(){const AC=A.ctx,t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(600,t+.09);o.connect(g);g.connect(A.sfx);env(g,t,.005,.16,.14);o.start(t);o.stop(t+.2);
    rustle(t,.05,1800);const i=3+(Math.random()*5|0);bell(PENTA[i]+12,t+.07,.07,A.sfx);bell(PENTA[i+2]+12,t+.2,.055,A.sfx);bell(PENTA[i+4]+12,t+.34,.035,A.sfx,3)},
  pet(){const t=A.ctx.currentTime;rustle(t,.06,2200);pluck(PENTA[5+(Math.random()*6|0)],t+.03,.05,A.sfx,1.2,'sine')},
  ripe(){const t=A.ctx.currentTime;bell(84,t,.03,A.sfx);bell(88,t+.12,.025,A.sfx)},
  harvest(){const t=A.ctx.currentTime,base=[72,76,79,81,84,88];base.forEach((m,i)=>bell(m,t+i*.065,.065-i*.006,A.sfx));rustle(t,.05,3200);
    for(let i=0;i<6;i++)pluck(96+[0,2,4,7][i%4],t+.35+i*.04,.012,A.sfx,.4,'sine')},
  star(){const t=A.ctx.currentTime;for(let i=0;i<10;i++)bell([84,86,88,91,93,96][Math.random()*6|0]+(i%3?0:12),t+i*.06,.04*(1-i/12),A.sfx,2.8);
    [60,64,67,72].forEach(m=>{const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.frequency.value=mf(m);o.connect(g);g.connect(A.sfx);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.5);g.gain.linearRampToValueAtTime(0,t+3);o.start(t);o.stop(t+3.1)})},
  complete(){const t=A.ctx.currentTime;[60,64,67,72,76,79].forEach((m,i)=>bell(m+12,t+i*.12,.05,A.sfx,3.5))},
  twinkle(){const t=A.ctx.currentTime;bell(PENTA[8+(Math.random()*5|0)]+12,t,.04,A.sfx,2.5)},
  animal(k){const AC=A.ctx,t=AC.currentTime;[0,1,2].forEach(i=>bell(PENTA[4+i*2]+12,t+i*.09,.035,A.sfx,1.8));
    if(k==='cat'){// 呼噜呼噜
      const s=src(false),f=AC.createBiquadFilter(),g=AC.createGain(),am=AC.createGain(),o=AC.createOscillator(),og=AC.createGain();
      f.type='lowpass';f.frequency.value=240;o.frequency.value=23;og.gain.value=.5;am.gain.value=.5;o.connect(og);og.connect(am.gain);
      s.connect(f);f.connect(am);am.connect(g);g.connect(A.sfx);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.25);g.gain.linearRampToValueAtTime(0,t+1.6);
      s.start(t,Math.random());s.stop(t+1.7);o.start(t);o.stop(t+1.7)}
    else rustle(t,.05,k==='sheep'?1200:1900)},
  tick(){const t=A.ctx.currentTime;pluck(84,t,.03,A.sfx,.25,'sine')},
  shower(k){const t0=A.ctx.currentTime,S={cat:[67,69,72,74,76,79],dog:[84,86,88,91,93,96],rabbit:[79,81,84,86,88,91],fox:[57,60,62,64,67,69],sheep:[60,64,67,71,72,76]}[k],
      gap={cat:.42,dog:.22,rabbit:.3,fox:.6,sheep:.8}[k],dec=k==='fox'||k==='sheep'?3.6:2.4;
    [S[0],S[2],S[4]].forEach((m,i)=>bell(m,t0+i*.1,.04,A.sfx,4));
    for(let i=1;i*gap<9.5;i++)bell(S[Math.random()*S.length|0]+(Math.random()<.25?12:0),t0+i*gap+Math.random()*.08,.03,A.sfx,dec)}
};
function sfx(n,arg){if(A.ctx&&!A.muted)try{SFX[n](arg)}catch(e){}}

/* ================= 输入 ================= */
let hover=null;
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;tmx=(e.clientX/W-.5)*2;tmy=(e.clientY/H-.5)*2;lastMouse=performance.now();hover=[e.clientX,e.clientY]});
cv.addEventListener('pointerleave',()=>hover=null);
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;tmx=clamp(e.gamma/22,-1,1);tmy=clamp(((e.beta||45)-45)/30,-1,1);lastMouse=performance.now()});
cv.addEventListener('pointerdown',e=>{
  if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
  closePetBar();
  const x=e.clientX,y=e.clientY,gx=x-par(28),t=dayT();
  // 0) 夜里的小动物（摸摸它，不弹文字）
  for(const k of unlockedAnimals()){const p=pets[k];if(!p||p._sx==null)continue;
    if(Math.hypot(x-p._sx,y-p._sy)<p._r+10){if(p.pet<1.2)petAnimal(p);return}}
  // 1) 成熟的花
  const fl=[...state.flowers].sort((a,b)=>b.ny-a.ny);
  for(const f of fl){if(f.h)continue;const hp=f._head;if(!hp)continue;const s=fScale(f.ny);
    if(Math.hypot(x-hp[0],y-hp[1])<34*s+10){
      if(f.g>=1){harvest(f);return}
      if(performance.now()-(f._pet||0)>500){f._pet=performance.now();f.g=Math.min(1,f.g+.04);f._wig=1;sfx('pet');for(let i=0;i<4;i++)parts.push({k:'heart',x:hp[0],y:hp[1],vx:(Math.random()-.5)*30,vy:-30-Math.random()*30,l:0,m:1.3})}
      return}}
  // 2) 星星
  if(y<H*.5&&nightF(t)>.35){const n=state.stars;for(let i=0;i<n;i++){const p=starXY(i);if(Math.hypot(x-p[0]-par(4),y-p[1])<16){sfx('twinkle');const cp=starName(i);toast(cp,1.8);return}}}
  // 3) 种花
  if(y>H*.735&&y<H*.94){
    if(nightF(t)>.5){toast('辛苦了，晚安！',1.8);return}
    const ny=clamp((y-H*.735)/(H*.195),0,1),nx=gx/W;
    if(state.flowers.filter(f=>!f.h).length>=MAXF){toast('花园满啦，先收获一些吧');return}
    const s=fScale(ny);if(state.flowers.some(f=>!f.h&&Math.hypot((f.nx-nx)*W,(plantY(f.ny)-plantY(ny))*1.6)<44*Math.max(s,fScale(f.ny)))){toast('这里离别的花太近啦',1.4);return}
    state.flowers.push({nx,ny,g:0,y:45+Math.floor(Math.random()*11),ph:Math.random()*6.28});
    sfx('plant');for(let i=0;i<10;i++)parts.push({k:'dirt',x,y,vx:(Math.random()-.5)*90,vy:-40-Math.random()*70,l:0,m:.7});
    parts.push({k:'ring',x,y,l:0,m:.8,s});for(let i=0;i<5;i++)parts.push({k:'spark',x:x+(Math.random()-.5)*30,y:y-Math.random()*30,vx:0,vy:-20,l:0,m:1});
    if(tipStage===0){tipStage=1;setTip('向日葵在阳光下长得更快，摸摸它也会长快一点')}
    save();return}
  parts.push({k:'ring',x,y,l:0,m:.6,s:U*.6});
});
function starName(i){let k=i;for(const c of CONS){if(k<c.pts.length)return`${c.name} · 第 ${k+1} 颗`;k-=c.pts.length}return`自由之星 · 第 ${k+1} 颗`}
function harvest(f){
  f.h=true;f.ht=0;state.seeds+=f.y;state.totalHarvest++;sfx('harvest');
  const tr=ui.seedN.getBoundingClientRect(),hp=f._head;
  for(let i=0;i<14;i++)parts.push({k:'seed',x0:hp[0]+(Math.random()-.5)*30,y0:hp[1]+(Math.random()-.5)*30,x1:tr.left+10,y1:tr.top+10,l:-i*.04,m:1,r:Math.random()*6});
  for(let i=0;i<10;i++)parts.push({k:'spark',x:hp[0],y:hp[1],vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,l:0,m:.9});
  toast(`收获了 <b>${f.y}</b> 颗瓜子`,1.6);
  if(tipStage<3){tipStage=3;setTip('')}save();
}

/* ================= 绘制 ================= */
let light,haze,inkC,now=0,dayF,ntF,wind,sunX=0;
function nightF(t){return t<.5?1-ss(.2,.27,t):ss(.74,.82,t)}
function shade(c,hz){return mix(mul(c,light),haze,hz)}
function drawRidge(pts,c,hz,off,lw,inkA){
  ctx.beginPath();ctx.moveTo(pts[0][0]+off,pts[0][1]);for(const p of pts)ctx.lineTo(p[0]+off,p[1]);ctx.lineTo(W+90+off,H+10);ctx.lineTo(-90+off,H+10);ctx.closePath();
  ctx.fillStyle=css(shade(c,hz));ctx.fill();
  ctx.beginPath();ctx.moveTo(pts[0][0]+off,pts[0][1]);for(const p of pts)ctx.lineTo(p[0]+off,p[1]);ctx.lineWidth=lw;ctx.strokeStyle=css(mix(inkC,haze,hz),inkA);ctx.stroke()}
function blob(circles,fill,stroke,lw){ctx.beginPath();for(const c of circles){ctx.moveTo(c[0]+c[2],c[1]);ctx.arc(c[0],c[1],c[2],0,6.283)}ctx.lineWidth=lw*2;ctx.strokeStyle=stroke;ctx.stroke();ctx.fillStyle=fill;ctx.fill()}

function frame(ts){
  const dt=Math.min(.1,(ts-(frame.last||ts))/1000);frame.last=ts;now+=dt;state.gameTime+=dt;
  const t=dayT(),h=t*24,sky=skyAt(t);light=sky.l;haze=sky.bot;ntF=nightF(t);dayF=1-ntF;
  inkC=mix(PAL.ink,mul(PAL.ink,light),.6);wind=.5+.5*Math.sin(now*.13)*Math.sin(now*.071+1);
  if(performance.now()-lastMouse>4000){tmx=Math.sin(now*.08)*.35;tmy=0}
  mx+=(tmx-mx)*Math.min(1,dt*2.5);my+=(tmy-my)*Math.min(1,dt*2.5);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineJoin='round';ctx.lineCap='round';

  /* 天空 */
  const g=ctx.createLinearGradient(0,0,0,H*.75);g.addColorStop(0,css(sky.top));g.addColorStop(.55,css(sky.mid));g.addColorStop(1,css(sky.bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 背景星
  if(ntF>.02){ctx.fillStyle='#fff6e2';for(const s of L.bg){ctx.globalAlpha=ntF*(.35+.35*Math.sin(now*s.sp+s.p))*s.s/1.6;ctx.fillRect(s.x*W+par(3),s.y*H,s.s,s.s)}ctx.globalAlpha=1}
  // 流星
  if(ntF>.7&&Math.random()<dt*.06&&!frame.meteor)frame.meteor={x:Math.random()*W,y:Math.random()*H*.2,l:0};
  if(frame.meteor){const m=frame.meteor;m.l+=dt;const p=m.l/1.1;if(p>1)frame.meteor=null;else{const x=m.x+p*260*U,y=m.y+p*120*U,gr=ctx.createLinearGradient(x,y,x-90*U,y-42*U);
    gr.addColorStop(0,`rgba(255,246,220,${.8*(1-p)})`);gr.addColorStop(1,'rgba(255,246,220,0)');ctx.strokeStyle=gr;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-90*U,y-42*U);ctx.stroke()}}
  drawConstellations(t);
  drawSunMoon(t,h);
  // 云
  for(const c of L.clouds){c.x-=c.v*dt*(.6+wind*.8);if(c.x<-200*U)c.x=W+200*U;
    const off=par(6+c.d*6),col=mix(mul(PAL.cloud,mix(light,[1,1,1],.25)),haze,.25+c.d*.15);
    ctx.globalAlpha=lerp(.95,.55,ntF);blob(c.parts.map(p=>[c.x+off+p[0]*c.s,c.y+p[1]*c.s,p[2]*c.s]),css(col),css(inkC,.35),1.5*U);ctx.globalAlpha=1}

  /* 远山 → 中景 → 雾 → 近丘 */
  drawRidge(L.far,PAL.far,.55,par(6),1.5*U,.35);
  drawRidge(L.mid,PAL.mid,.35,par(12),1.8*U,.5);
  const om=par(12);for(const p of L.pines){const x=p.x+om,y=p.y,s=p.s,c=css(shade(PAL.pine,.35)),k=css(mix(inkC,haze,.35),.55);
    ctx.fillStyle=c;ctx.strokeStyle=k;ctx.lineWidth=1.3*U;for(let i=0;i<2;i++){const yy=y-i*8*s;ctx.beginPath();ctx.moveTo(x,yy-18*s);ctx.lineTo(x+8*s-i*2*s,yy);ctx.lineTo(x-8*s+i*2*s,yy);ctx.closePath();ctx.fill();ctx.stroke()}}
  const mist=.22+.45*bump(h,6.3,1.4)+.12*ntF;fogBand(H*.5,H*.62,mist);
  drawRidge(L.near,PAL.near,.15,par(20),2*U,.65);
  drawHouse(par(20));
  const on=par(20);for(const tr of L.trees){const x=tr.x+on,y=tr.y,s=tr.s;ctx.fillStyle=css(shade(PAL.trunk,.15));ctx.strokeStyle=css(mix(inkC,haze,.15),.7);ctx.lineWidth=1.6*U;
    ctx.beginPath();ctx.rect(x-2.5*s,y-14*s,5*s,14*s);ctx.fill();ctx.stroke();
    const sw=Math.sin(now*.8+tr.k*6)*1.2*s;blob([[x+sw,y-26*s,11*s],[x-9*s+sw,y-18*s,8*s],[x+9*s+sw,y-19*s,8.5*s],[x+sw*.5,y-36*s,7*s]],css(shade(mix(PAL.tree,PAL.pine,tr.k*.4),.15)),css(mix(inkC,haze,.15),.7),1.3*U)}
  fogBand(H*.6,H*.71,mist*.6);

  /* 花园草地 */
  const og=par(28);
  ctx.beginPath();ctx.moveTo(L.gnd[0][0]+og,L.gnd[0][1]);for(const p of L.gnd)ctx.lineTo(p[0]+og,p[1]);ctx.lineTo(W+90,H+10);ctx.lineTo(-90,H+10);ctx.closePath();
  const gg=ctx.createLinearGradient(0,H*.69,0,H);gg.addColorStop(0,css(shade(PAL.ground,.12)));gg.addColorStop(1,css(shade(PAL.groundB,0)));ctx.fillStyle=gg;ctx.fill();
  ctx.lineWidth=2.2*U;ctx.strokeStyle=css(inkC,.7);ctx.beginPath();ctx.moveTo(L.gnd[0][0]+og,L.gnd[0][1]);for(const p of L.gnd)ctx.lineTo(p[0]+og,p[1]);ctx.stroke();
  drawTufts(og);
  if(hover&&ntF<=.5&&hover[1]>H*.735&&hover[1]<H*.94){const ny=clamp((hover[1]-H*.735)/(H*.195),0,1),s=fScale(ny);ctx.setLineDash([4*U,5*U]);ctx.strokeStyle=css(inkC,.45);ctx.lineWidth=1.6*U;
    ctx.beginPath();ctx.ellipse(hover[0],hover[1],16*s,6*s,0,0,6.283);ctx.stroke();ctx.setLineDash([])}

  /* 向日葵 & 小动物（按远近排序） */
  updateFlowers(dt);updatePets(dt);
  const items=[...state.flowers,...unlockedAnimals().map(getPet)].sort((a,b)=>a.ny-b.ny);
  for(const it of items)it.isPet?drawAnimal(it,og):drawFlower(it,og);

  /* 生灵 & 粒子 */
  drawCritters(dt);drawParts(dt);

  /* 前景虚化草叶 */
  drawForeground(par(46));
  // 暗角
  const vg=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.35,W/2,H*.55,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(40,36,50,0)');vg.addColorStop(1,`rgba(40,36,50,${.16+.14*ntF})`);ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  drawShower(dt);
  updateUI(dt,t,h);
  requestAnimationFrame(frame);
}
function fogBand(y0,y1,a){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,css(haze,0));g.addColorStop(.6,css(haze,a));g.addColorStop(1,css(haze,0));ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0)}

function drawSunMoon(t,h){
  const hor=H*.5;
  if(t>.2&&t<.8){const p=(t-.25)/.5,x=W*(.08+.84*p)+par(4),y=hor-Math.sin(Math.PI*clamp(p,-.1,1.1))*H*.4+H*.03,r=26*U,warm=1-ss(.0,.25,Math.min(p,1-p));sunX=x;
    const gl=ctx.createRadialGradient(x,y,r,x,y,r*7);gl.addColorStop(0,`rgba(255,226,180,${.35+.2*warm})`);gl.addColorStop(1,'rgba(255,226,180,0)');ctx.fillStyle=gl;ctx.fillRect(x-r*7,y-r*7,r*14,r*14);
    if(warm>.05){const hg=ctx.createRadialGradient(x,hor,0,x,hor,W*.5);hg.addColorStop(0,`rgba(246,178,140,${.35*warm})`);hg.addColorStop(1,'rgba(246,178,140,0)');ctx.fillStyle=hg;ctx.fillRect(0,0,W,H*.75)}
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle=css(mix(hex('#f8ecca'),hex('#f4c39c'),warm));ctx.fill();ctx.lineWidth=2*U;ctx.strokeStyle=css(PAL.ink,.35);ctx.stroke()}
  else sunX=W/2;
  let mt=t<.5?t+1:t;if(mt>.72&&mt<1.28){const p=(mt-.75)/.5,x=W*(.08+.84*p)+par(4),y=hor-Math.sin(Math.PI*clamp(p,-.1,1.1))*H*.36+H*.03,r=19*U;
    ctx.globalAlpha=.6;ctx.drawImage(GLOW_STAR,x-r*4,y-r*4,r*8,r*8);ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle='#efe9d6';ctx.fill();ctx.lineWidth=2*U;ctx.strokeStyle=css(PAL.ink,.45);ctx.stroke();
    ctx.fillStyle='rgba(180,170,150,.35)';[[-6,-4,4],[5,3,5],[-2,8,2.5],[7,-8,2]].forEach(c=>{ctx.beginPath();ctx.arc(x+c[0]*U,y+c[1]*U,c[2]*U,0,6.283);ctx.fill()})}
}

function drawConstellations(t){
  const a=ss(.15,.75,ntF);if(a<=0)return;const n=state.stars,off=par(4);let k=0;
  const fresh=state.gameTime-state.newAt<DAY;
  for(const c of CONS){const lit=clamp(n-k,0,c.pts.length),done=lit===c.pts.length,pos=c.pts.map((_,i)=>{const p=starXY(k+i);return[p[0]+off,p[1]]});
    // 连线
    ctx.lineWidth=1.4*U;ctx.strokeStyle=`rgba(243,227,176,${a*(done?.6:.38)})`;ctx.setLineDash(done?[]:[3*U,4*U]);
    ctx.beginPath();for(const[i,j]of c.e)if(i<lit&&j<lit){ctx.moveTo(pos[i][0],pos[i][1]);ctx.lineTo(pos[j][0],pos[j][1])}ctx.stroke();ctx.setLineDash([]);
    // 当前星座未点亮的位置
    if(lit<c.pts.length&&lit>0||(lit===0&&k===n))for(let i=lit;i<c.pts.length;i++){ctx.strokeStyle=`rgba(243,227,176,${a*.22})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(pos[i][0],pos[i][1],3*U,0,6.283);ctx.stroke()}
    for(let i=0;i<lit;i++)drawStar(pos[i][0],pos[i][1],(3.2+(done?.6:0))*U,a*(.82+.18*Math.sin(now*1.7+i*2+k)),k+i===n-1&&fresh);
    if(done){ctx.fillStyle=`rgba(250,240,210,${a*.55})`;ctx.font=`${12*U+2}px "PingFang SC","Microsoft YaHei",sans-serif`;ctx.textAlign='center';
      const cy=Math.max(...pos.map(p=>p[1]));ctx.fillText(c.name,pos.reduce((s,p)=>s+p[0],0)/pos.length,cy+20*U)}
    k+=c.pts.length;if(k>=Math.max(n,1)&&lit<c.pts.length)break}
  for(let i=TOTAL_CONS;i<n;i++){const p=starXY(i);drawStar(p[0]+off,p[1],3*U,a*(.8+.2*Math.sin(now*1.5+i)),i===n-1&&fresh)}
}
function drawStar(x,y,r,a,isNew){
  // 刚兑换的星：从地面飞上去
  if(isNew){const age=state.gameTime-state.newAt;if(age<2.4){const p=easeOut(clamp(age/2.2,0,1)),sx=W/2,sy=H*.85;x=lerp(sx,x,p);y=lerp(sy,y,p)-Math.sin(p*Math.PI)*60*U;r*=1+(1-p)*.5}
    const pr=(now*.6)%1;ctx.strokeStyle=`rgba(255,240,200,${a*(1-pr)*.7})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r*(2+pr*6),0,6.283);ctx.stroke()}
  ctx.globalAlpha=a*.9;ctx.drawImage(GLOW_STAR,x-r*5,y-r*5,r*10,r*10);ctx.globalAlpha=a;
  ctx.fillStyle='#fbf1d2';ctx.beginPath();ctx.moveTo(x,y-r*2);ctx.quadraticCurveTo(x,y,x+r*2,y);ctx.quadraticCurveTo(x,y,x,y+r*2);ctx.quadraticCurveTo(x,y,x-r*2,y);ctx.quadraticCurveTo(x,y,x,y-r*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r*.55,0,6.283);ctx.fill();ctx.globalAlpha=1;
  if(isNew&&state.gameTime-state.newAt>2.4){ctx.fillStyle=`rgba(250,240,210,${a*.75})`;ctx.font=`${11*U+2}px "PingFang SC","Microsoft YaHei",sans-serif`;ctx.textAlign='center';ctx.fillText('你点亮的星',x,y-r*4.5)}
}

function drawHouse(off){
  const{x:hx,y}=L.house,x=hx+off,s=U*1.05,ink=css(mix(inkC,haze,.15),.8);ctx.lineWidth=1.8*U;ctx.strokeStyle=ink;
  ctx.fillStyle=css(shade(hex('#a99485'),.15));ctx.beginPath();ctx.rect(x+11*s,y-52*s,7*s,14*s);ctx.fill();ctx.stroke();
  ctx.fillStyle=css(shade(PAL.wall,.15));ctx.beginPath();ctx.rect(x-22*s,y-30*s,44*s,30*s);ctx.fill();ctx.stroke();
  ctx.fillStyle=css(shade(PAL.roof,.15));ctx.beginPath();ctx.moveTo(x-28*s,y-29*s);ctx.lineTo(x,y-50*s);ctx.lineTo(x+28*s,y-29*s);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=css(shade(hex('#9c8170'),.15));ctx.beginPath();ctx.rect(x-14*s,y-17*s,9*s,17*s);ctx.fill();ctx.stroke();
  const lit=ss(.3,.8,ntF)+.25*bump(dayT()*24,6,1);ctx.fillStyle=css(mix(shade(hex('#c9d3d6'),.15),hex('#f2d08a'),clamp(lit,0,1)));ctx.beginPath();ctx.rect(x+3*s,y-21*s,11*s,10*s);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+8.5*s,y-21*s);ctx.lineTo(x+8.5*s,y-11*s);ctx.moveTo(x+3*s,y-16*s);ctx.lineTo(x+14*s,y-16*s);ctx.stroke();
  if(lit>.05){ctx.globalAlpha=clamp(lit,0,1)*.8;ctx.drawImage(GLOW_WARM,x-20*s,y-45*s,58*s,58*s);ctx.globalAlpha=1}
  // 炊烟
  if(Math.random()<.04)smoke.push({x:hx+14.5*s,y:y-54*s,l:0,r:3*s});
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.l+=1/60;p.y-=7*U/60;p.x+=(3+wind*5)*U/60;p.r+=1.6*U/60;if(p.l>5){smoke.splice(i,1);continue}
    ctx.globalAlpha=.32*(1-p.l/5)*ss(0,.6,p.l);ctx.fillStyle=css(mix(hex('#f4efe6'),haze,.4));ctx.beginPath();ctx.arc(p.x+off,p.y,p.r,0,6.283);ctx.fill()}ctx.globalAlpha=1;
}

function drawTufts(off){
  ctx.lineWidth=1.4*U;
  for(const t of L.tufts){const d=(t.y-H*.7)/(H*.3),s=(.5+d*.9)*U,x=t.x+off*(.6+d*.4),y=t.y,sw=Math.sin(now*1.2+t.k*9)*1.5*s*(.5+wind);
    if(t.t===0){ctx.strokeStyle=css(shade(PAL.grassF,.1*(1-d)),.8);ctx.beginPath();ctx.moveTo(x-4*s,y);ctx.quadraticCurveTo(x-4*s,y-5*s,x-6*s+sw,y-9*s);ctx.moveTo(x,y);ctx.lineTo(x+sw,y-12*s);ctx.moveTo(x+4*s,y);ctx.quadraticCurveTo(x+4*s,y-5*s,x+7*s+sw,y-8*s);ctx.stroke()}
    else{ctx.strokeStyle=css(shade(PAL.grassF,0),.8);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sw,y-10*s);ctx.stroke();
      ctx.fillStyle=css(shade(t.t===1?hex('#f4efe3'):hex('#cdbfd8'),0));ctx.strokeStyle=css(inkC,.6);ctx.lineWidth=1*U;
      ctx.beginPath();for(let i=0;i<5;i++){const a=i/5*6.283;ctx.moveTo(x+sw+Math.cos(a)*3*s+2.2*s,y-10*s+Math.sin(a)*3*s);ctx.arc(x+sw+Math.cos(a)*3*s,y-10*s+Math.sin(a)*3*s,2.2*s,0,6.283)}ctx.stroke();ctx.fill();
      ctx.fillStyle=css(shade(hex('#e3c46e'),0));ctx.beginPath();ctx.arc(x+sw,y-10*s,1.6*s,0,6.283);ctx.fill();ctx.lineWidth=1.4*U}}
}

/* ---- 向日葵 ---- */
function updateFlowers(dt){
  for(let i=state.flowers.length-1;i>=0;i--){const f=state.flowers[i];
    if(f.h){f.ht+=dt;if(f.ht>1.8)state.flowers.splice(i,1);continue}
    if(f.g<1){f.g=Math.min(1,f.g+dt/GROW*(.35+.65*dayF));if(f.g>=1){sfx('ripe');if(f._head)for(let k=0;k<8;k++)parts.push({k:'spark',x:f._head[0],y:f._head[1],vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,l:0,m:1});
      if(tipStage<2){tipStage=2;setTip('点击成熟的向日葵，收获瓜子')}}}
    if(f._wig)f._wig=Math.max(0,f._wig-dt*1.5)}
}

  const blush=(bx,by,r)=>[-1,1].forEach(sd=>fE(bx*sd,by,r,r*.55,0,`rgba(231,160,150,${.4+.5*(o.cheek||0)})`));

    shape(()=>{el(0,0,50,42);el(-28,13,23,21);el(28,13,23,21)},P.base,()=>{
      fE(0,26,30,20,0,P.white);fE(0,-30,30,9,0,'rgba(255,255,255,.12)');
      stroke([0,-43,0,-29,-11,-41,-9,-30,11,-41,9,-30,-52,2,-39,5,-52,11,-40,11,52,2,39,5,52,11,40,11],P.dark,4)});
    eyes(19,-3,9.5,true);blush(30,13,7);
    c.fillStyle=P.nose;c.beginPath();tri([-4.5,9,4.5,9,0,14.5]);c.fill();mouth(17,6);tongue(19,4,8);
    stroke([28,13,54,9,28,17,54,20,-28,13,-54,9,-28,17,-54,20],'rgba(79,70,63,.5)',1.4);
    if(pw>.02){c.globalAlpha*=Math.min(1,pw*3);paw(38+Math.sin(t*14)*4*pw,58-42*pw,P.white,P.inner,-.4*pw+Math.sin(t*14)*.25*pw)}
  }else if(k==='dog'){
    mirror(()=>{c.save();c.translate(25,-31);c.rotate(.14+ew);shape(()=>tri([-13,9,0,-29,13,7]),P.dark,()=>{c.fillStyle=P.inner;c.beginPath();tri([-7,5,0,-19,7,4]);c.fill()});c.restore()});
    shape(()=>{el(0,0,48,42);el(0,20,32,23)},P.white,()=>{
      c.fillStyle=P.base;c.beginPath();el(0,-30,54,26);el(-42,-4,13,22);el(42,-4,13,22);c.fill();
      fE(0,-21,4.5,14,0,P.dark);[-1,1].forEach(sd=>{fE(18*sd,-1,13,11,0,P.white);fE(16*sd,-17,5,3.5,0,P.white)})});
    eyes(18,-1,8.5,false);blush(30,15,7);
    fE(0,10,8.5,5.8,0,P.nose);fE(-2.5,8,2.6,1.6,0,'rgba(255,255,255,.5)');mouth(19,7);tongue(20,7,15);
  }else if(k==='rabbit'){
    mirror(()=>{c.save();c.translate(14,-34);c.rotate(.1+ew);shape(()=>el(0,-26,10,30),P.base,()=>{fE(0,-24,5,22,0,P.inner);fE(0,-56,12,8,0,P.dark)});c.restore()});
    shape(()=>{el(0,4,46,40);el(-25,18,20,16);el(25,18,20,16)},P.base,()=>{fE(0,22,19,14,0,P.white);fE(-14,-22,14,6,-.3,'rgba(255,255,255,.3)')});
    eyes(20,0,10.5,false);blush(31,16,7);
    c.save();c.translate(0,12);c.scale(o.nose||1,o.nose||1);c.fillStyle=P.nose;c.beginPath();tri([-4,-2,4,-2,0,3]);c.fill();c.restore();
    mouth(18,6);c.fillStyle='#fffaf2';c.strokeStyle=ink;c.lineWidth=L*.55;c.beginPath();if(c.roundRect)c.roundRect(-4,19.5,8,6,1.6);else c.rect(-4,19.5,8,6);c.fill();c.stroke();stroke([0,19.8,0,25],'rgba(79,70,63,.45)',.9);
    if(pw>.02){c.globalAlpha*=Math.min(1,pw*3);[-1,1].forEach(sd=>paw(sd*(30-6*pw),52-24*pw,P.white,P.inner,sd*.3*pw))}
  }else if(k==='fox'){
    mirror(()=>{c.save();c.translate(29,-27);c.rotate(.3+ew);shape(()=>tri([-14,9,2,-33,14,3]),P.base,()=>{c.fillStyle=P.dark;c.beginPath();tri([-14,-8,2,-36,14,-10]);c.fill();c.fillStyle=P.inner;c.beginPath();tri([-7,4,1,-19,7,1]);c.fill()});c.restore()});
    shape(()=>{el(0,-4,44,38);tri([-40,-6,-14,30,-60,24]);tri([40,-6,60,24,14,30]);el(0,24,18,16)},P.base,()=>{
      c.fillStyle=P.white;c.beginPath();c.moveTo(-62,24);c.quadraticCurveTo(-30,2,0,14);c.quadraticCurveTo(30,2,62,24);c.lineTo(30,60);c.lineTo(-30,60);c.fill();
      fE(0,-30,22,7,0,'rgba(255,255,255,.14)')});
    eyes(18,-6,8,true);blush(30,13,6);
    fE(0,17,6.5,4.6,0,P.nose);fE(-2,15.5,2,1.2,0,'rgba(255,255,255,.5)');mouth(24,5);tongue(26,4,7);
  }else{
    mirror(()=>{c.save();c.translate(36,-6);c.rotate(.35+ew);shape(()=>el(11,0,16,7),P.base,()=>fE(11,0,11,3.6,0,P.inner));c.restore()});
    shape(()=>el(0,6,32,42),P.base,()=>{fE(0,34,20,13,0,'#8e7f75');fE(-10,-12,8,14,-.3,'rgba(255,255,255,.1)')});
    shape(()=>{[[-24,-32,14],[-8,-42,15],[10,-42,15],[26,-32,13],[0,-28,14],[-14,-26,10],[16,-26,10]].forEach(q=>el(q[0],q[1],q[2],q[2]))},P.white,()=>{
      c.strokeStyle='#d6ccbb';c.lineWidth=2;c.beginPath();[[-20,-36],[-4,-44],[12,-42],[22,-30],[0,-32]].forEach(([x,y])=>{c.moveTo(x+4,y);c.arc(x,y,4,0,Math.PI*1.3)});c.stroke()});
    eyes(15,2,8,false);blush(24,18,7);
    [-1,1].forEach(sd=>fE(5*sd,30,2.8,1.8,0,P.nose));c.strokeStyle=ink;c.lineWidth=L*.7;c.beginPath();c.arc(0,34,5,.3,Math.PI-.3);c.stroke();
  }

// 流星雨开场：大脸弹出 + 每只动物各自的卖萌动作
const easeBack=x=>1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2);
function drawShowerFace(){
  const t=shower.t,k=shower.k;if(t>4.8)return;
  const a=t-.5,out=ss(4,4.8,t),sc=(t<.5?easeBack(t/.5):1)*(1-out*.35),R=Math.min(W,H)*.15,cx=W/2,cy=H*.4-out*40*U;
  const o={eyes:'open',t,blink:Math.sin(t*3.1)>.96?.15:1};let tilt=0,bob=0;
  if(k==='cat'){tilt=Math.sin(a*2.4)*.14;o.paw=ss(.1,.5,a)*(1-ss(3,3.4,a));o.eyes=a>1.1&&a<2.7?'wink':'open';o.tongue=a>1.3&&a<2.9?ss(1.3,1.5,a):0;o.cheek=.6}   // 歪头、眨眼吐舌、招手
  else if(k==='dog'){o.eyes='happy';o.tongue=ss(0,.4,a);o.ear=Math.sin(a*14)*.12;bob=Math.abs(Math.sin(a*6))*8;tilt=Math.sin(a*3)*.06}                        // 吐舌头开心地蹦
  else if(k==='rabbit'){o.ear=Math.sin(a*9)*.22;o.paw=ss(.2,.6,a)*(1-ss(3,3.4,a));o.eyes=a>1.5?'happy':'open';o.cheek=ss(1,1.6,a);o.nose=1+Math.sin(a*30)*.12} // 捧脸、耳朵晃、鼻子抽动
  else if(k==='fox'){tilt=ss(0,.5,a)*.3*(1-ss(2.9,3.4,a));o.eyes=a>.7&&a<1.9?'wink':a>=1.9?'happy':'open';o.tongue=a>1.9&&a<3?ss(1.9,2.1,a):0;o.ear=Math.sin(a*5)*.06} // 大歪头、眨眼
  else{tilt=Math.sin(a*2)*.14;o.eyes='happy';o.cheek=.5+.5*Math.sin(a*4);o.ear=Math.sin(a*6)*.15}                                                              // 害羞摇摆
  ctx.save();ctx.globalAlpha=1-out;ctx.translate(cx,cy-bob*U);ctx.scale(sc,sc);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=(1-out)*.55;ctx.drawImage(GLOW_SH[k],-R*2.6,-R*2.6,R*5.2,R*5.2);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1-out;ctx.rotate(tilt);drawFace(ctx,k,R,o);ctx.restore();
  if(t>.4&&t<4&&Math.random()<.25)skyBits.push({t:'heart',x:cx+(Math.random()-.5)*R*3,y:cy+(Math.random()-.3)*R*1.6,l:0,m:1.6,col:SHOWER_COL[k]});
}

/* ---- 右侧动物头像栏 ---- */
const PETBAR={};
function buildPetBar(){
  const bar=document.getElementById('petBar');
  for(const c of CONS){const k=c.animal,el=document.createElement('div');el.className='pb';
    el.innerHTML=`<button class="ava" aria-label="${ANIMALS[k].name}"><canvas width="88" height="88"></canvas></button>
      <div class="pop"><b></b><div class="lb"><i></i></div><span class="lt"></span><button class="go">✦ 看流星雨<small>1000 瓜子</small></button><em></em></div>`;
    const cc=el.querySelector('canvas').getContext('2d');cc.translate(44,k==='rabbit'?58:k==='sheep'?50:52);drawFace(cc,k,k==='rabbit'?24:k==='sheep'?27:28,{eyes:'open'});
    el.querySelector('.ava').onclick=e=>{e.stopPropagation();const open=!el.classList.contains('open');for(const q in PETBAR)PETBAR[q].el.classList.remove('open');el.classList.toggle('open',open);sfx('tick')};
    el.querySelector('.go').onclick=e=>{e.stopPropagation();if(petReason(k))return;state.seeds-=1000;state.love[k]=0;el.classList.remove('open');startShower(k);save()};
    bar.appendChild(el);PETBAR[k]={el,cons:c,key:''}}
}
function petReason(k){
  if(!unlockedAnimals().includes(k))return'locked';const lv=state.love[k]||0;
  if(lv<100)return`再摸摸它，好感还差 ${100-lv}`;if(state.seeds<1000)return`瓜子还差 ${1000-state.seeds}`;
  if(ntF<.5)return'天黑后才能看流星雨';if(shower)return'流星雨正在进行';return'';
}
function closePetBar(){for(const q in PETBAR)PETBAR[q].el.classList.remove('open')}
function updatePetBar(){
  const ul=unlockedAnimals();document.getElementById('petBar').style.display=ul.length?'':'none';
  for(const k in PETBAR){const B=PETBAR[k],un=ul.includes(k),lv=state.love[k]||0,why=petReason(k),key=[un,lv,why].join('|');if(key===B.key)continue;B.key=key;
    const el=B.el;el.classList.toggle('locked',!un);el.classList.toggle('full',un&&lv>=100);
    el.querySelector('b').textContent=un?ANIMALS[k].name:'还没遇见';
    el.querySelector('.lb').style.display=el.querySelector('.lt').style.display=el.querySelector('.go').style.display=un?'':'none';
    el.querySelector('.lb i').style.width=lv+'%';el.querySelector('.lt').textContent=`好感 ${lv}/100`;
    el.querySelector('.go').disabled=!!why;el.querySelector('em').textContent=un?why:`点亮「${B.cons.name}」后，它会来花园`}
}

/* ---- HUD ---- */
function updateUI(dt,t,h){
  seedShown+=(state.seeds-seedShown)*Math.min(1,dt*6);if(Math.abs(state.seeds-seedShown)<.5)seedShown=state.seeds;
  ui.seedN.textContent=Math.round(seedShown);ui.starN.textContent=state.stars;
  const hh=Math.floor(h),mm=Math.floor((h-hh)*60);ui.time.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  const ph=phaseName(h);ui.phase.textContent=ph;
  if(ph!==lastPhase){if(lastPhase){const sun=ph==='日落';ui.banner.textContent=sun?'有人一天看了44次日落':ph;ui.banner.classList.toggle('long',sun);ui.banner.style.opacity=1;bannerT=sun?3.2:2.6}lastPhase=ph}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)ui.banner.style.opacity=0}
  if(toastT>0){toastT-=dt;if(toastT<=0)ui.toast.classList.remove('show')}
  updatePetBar();
  // 第一只动物解锁后，短暂提示一次好感玩法
  if(!state.loveHint&&unlockedAnimals().length&&toastT<=0){state.loveHint=true;setTip('摸摸小动物会增加好感，点右边的头像能看到好感；满 100 后可以用 1000 瓜子换一场流星雨');tipHideT=7;save()}
  if(tipHideT>0){tipHideT-=dt;if(tipHideT<=0)setTip('')}
  const ok=state.seeds>=100;ui.exch.disabled=!ok;ui.exch.classList.toggle('ready',ok);ui.bar.style.width=Math.min(100,state.seeds)+'%';
  // 小表盘
  const d=ui.dial,c=22;d.clearRect(0,0,44,44);d.lineWidth=2.5;d.strokeStyle='#5b5149';d.fillStyle='#e9e2d0';d.beginPath();d.arc(c,c,18,0,6.283);d.fill();d.stroke();
  d.fillStyle='#bfc6d6';d.beginPath();d.moveTo(c,c);d.arc(c,c,18,0,Math.PI);d.fill();d.stroke();
  const a=Math.PI/2+t*6.283,px=c+Math.cos(a)*11,py=c+Math.sin(a)*11;d.fillStyle=ntF>.5?'#f2ecd6':'#e9c46f';d.beginPath();d.arc(px,py,5,0,6.283);d.fill();d.stroke();
}
buildPetBar();
requestAnimationFrame(frame);
</script>
